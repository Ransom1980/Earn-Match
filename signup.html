<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EarnMatch — Get Matched</title>

<meta name="description" content="Tell EarnMatch about yourself and discover income opportunities matched to you.">

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:20px;
  color:#111827;
}

.container{
  max-width:600px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:18px;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#111827;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Find Your Income Match</h1>

<p class="subtitle">
Tell us a little about yourself and EarnMatch will help identify opportunities that fit you.
</p>

<form action="https://api.web3forms.com/submit" method="POST">
<input type="hidden" name="access_key" value="143bf6d4-b1a2-41a0-a183-476d8ba2bbc5">
<input type="hidden" name="subject" value="New EarnMatch Signup">
<input type="hidden" name="from_name" value="EarnMatch">
<input type="hidden" name="redirect" value="https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPOSITORY-NAME/results.html">  
<label for="name">Your Name</label>
<input type="text" id="name" name="Name" required>

<label for="email">Email Address</label>
<input type="email" id="email" name="Email" required>

<label for="time">How much time can you dedicate?</label>
<select id="time" name="Available Time" required>
<option value="">Select one</option>
<option>Less than 5 hours/week</option>
<option>5–10 hours/week</option>
<option>10–20 hours/week</option>
<option>20–40 hours/week</option>
<option>40+ hours/week</option>
</select>

<label for="skills">What are your main skills?</label>
<textarea id="skills" name="Skills" rows="4" placeholder="Example: cooking, sales, driving, writing, construction..." required></textarea>

<label for="budget">How much can you start with?</label>
<select id="budget" name="Starting Budget" required>
<option value="">Select one</option>
<option>$0</option>
<option>$1–$100</option>
<option>$101–$500</option>
<option>$501–$1,000</option>
<option>$1,000+</option>
</select>

<label for="goal">What's your monthly income goal?</label>
<select id="goal" name="Income Goal" required>
<option value="">Select one</option>
<option>$500/month</option>
<option>$1,000/month</option>
<option>$2,000/month</option>
<option>$5,000/month</option>
<option>$10,000+/month</option>
</select>

<button type="submit">Get My EarnMatch</button>

</form>

<a class="back" href="./index.html">← Back to EarnMatch</a>

</div>

</body>
</html>
